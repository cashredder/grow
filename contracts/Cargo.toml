[workspace]
resolver = "2"
members = ["token", "launchpad", "common"]

[workspace.dependencies]
near-sdk = { version = "5.14", default-features = false, features = ["legacy"] }
uint = { version = "0.9", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
