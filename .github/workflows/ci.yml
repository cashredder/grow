# Contract unit tests need near-sdk's native test VM (C libraries), so they run here on Linux.
name: ci
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown -p grow-token -p grow-launchpad
  e2e:
    # The real wasm contracts on a local NEAR sandbox node (contracts/e2e).
    runs-on: ubuntu-latest
    needs: contracts
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build the contracts
        run: (cd token && cargo near build non-reproducible-wasm --no-abi) && (cd launchpad && cargo near build non-reproducible-wasm --no-abi)
      - name: Sandbox tests
        run: cargo test --manifest-path e2e/Cargo.toml -- --nocapture
        env:
          WASM_DIR: ${{ github.workspace }}/contracts/target/near
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
