# grow. API: Cloudflare Worker + D1 + R2 + two Durable Objects (the clock that indexes and runs agents, and the
# live feed). Local values below; production overrides under [env.production]. Secrets (never in this file):
#   wrangler secret put RELAYER_KEY       --env production   # ed25519:... function-call key of the relayer account
#   wrangler secret put HOUSE_FUNDER_KEY  --env production   # optional: full-access key of the house-funder account
#   wrangler secret put ADMIN_TOKEN       --env production   # moderation and admin endpoints
#   wrangler secret put SESSION_SALT      --env production   # random string, salts IP hashes and API keys
name = "grow-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NETWORK = "testnet"
RPC_URL = "https://rpc.testnet.near.org"
NEARDATA_URL = "https://testnet.neardata.xyz"
LAUNCHPAD = "grow.testnet"
RELAYER = "relayer.grow.testnet"
HOUSE_FUNDER = ""
PUBLIC_URL = "http://127.0.0.1:8788"
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174"
START_BLOCK = "0"
NEAR_USD_FALLBACK = "2.5"
CLOCK_EVERY_MS = "2000"
AGENTS_ENABLED = "true"
HOUSE_BUDGET_NEAR = "100"

[[d1_databases]]
binding = "DB"
database_name = "grow"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "grow-files"

[[durable_objects.bindings]]
name = "CLOCK"
class_name = "Clock"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Clock", "Hub"]

[triggers]
crons = ["* * * * *"]

[env.production]
name = "grow-api"
routes = [{ pattern = "api.grow.example", custom_domain = true }]

[env.production.vars]
NETWORK = "mainnet"
RPC_URL = "https://rpc.mainnet.near.org"
NEARDATA_URL = "https://mainnet.neardata.xyz"
LAUNCHPAD = "grow.near"
RELAYER = "relayer.grow.near"
HOUSE_FUNDER = "house.grow.near"
PUBLIC_URL = "https://api.grow.example"
ALLOWED_ORIGINS = "https://grow.example"
START_BLOCK = "0"
NEAR_USD_FALLBACK = "2.5"
CLOCK_EVERY_MS = "2000"
AGENTS_ENABLED = "true"
HOUSE_BUDGET_NEAR = "100"

[[env.production.d1_databases]]
binding = "DB"
database_name = "grow"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "grow-files"

[[env.production.durable_objects.bindings]]
name = "CLOCK"
class_name = "Clock"

[[env.production.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Clock", "Hub"]

[env.production.triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------- testnet (workers.dev, no custom domain)
# scripts/testnet.sh fills LAUNCHPAD, RELAYER, HOUSE_FUNDER, PUBLIC_URL, START_BLOCK and the database id.
[env.testnet]
name = "grow-api-testnet"
workers_dev = true

[env.testnet.vars]
NETWORK = "testnet"
RPC_URL = "https://rpc.testnet.fastnear.com,https://near-testnet.drpc.org,https://rpc.testnet.near.org,https://test.rpc.fastnear.com"
NEARDATA_URL = "https://testnet.neardata.xyz"
TX_API_URL = "https://tx.test.fastnear.com"
LAUNCHPAD = "growpad.testnet"
RELAYER = "growpad-relayer.testnet"
HOUSE_FUNDER = "growpad-house.testnet"
PUBLIC_URL = "https://grow-api-testnet.grow-api.workers.dev"
ALLOWED_ORIGINS = "http://127.0.0.1:5174,http://127.0.0.1:5173"
START_BLOCK = "276668000"
NEAR_USD_FALLBACK = "2.5"
CLOCK_EVERY_MS = "2000"
AGENTS_ENABLED = "true"
HOUSE_BUDGET_NEAR = "5"
MIN_TRADE_NEAR = "0.05"
AI_MODEL = "z-ai/glm-5.3-flash"

[[env.testnet.d1_databases]]
binding = "DB"
database_name = "grow-testnet"
database_id = "8f7d1247-030b-41ad-918c-fc79534f8ebb"

# No R2 on testnet: uploads are stored in D1 (src/lib/blobs.ts).

[[env.testnet.durable_objects.bindings]]
name = "CLOCK"
class_name = "Clock"

[[env.testnet.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[env.testnet.migrations]]
tag = "v1"
new_sqlite_classes = ["Clock", "Hub"]

[env.testnet.triggers]
crons = ["* * * * *"]
